name: Build and Package

on:
  workflow_dispatch:
    inputs:
      runner:
        type: choice
        description: 'Runner to use'
        options:
        - 'Runner_integration-web-editor'
        - 'ubuntu-latest'
      registry:
        description: 'Docker registry to use'
        required: true
        default: digiopsacr.azurecr.io
      namespace:
        description: 'Docker namespace to use'
        required: true
        default: wso2

jobs:
  build:
    runs-on: ${{ github.event.inputs.runner }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: ${{ github.event.inputs.registry }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
          build-essential \
          g++ \
          libx11-dev \
          libxkbfile-dev \
          libsecret-1-dev \
          libkrb5-dev \
          python-is-python3 \
          git \
          curl \
          tar

      - name: build source
        run: |
          npm ci
          npm run compile-build
          npm run minify-vscode-reh-web
          npm run gulp vscode-reh-web-linux-x64-min-ci
          npm run extensions-ci
          mkdir app && cp -r ../vscode-reh-web-linux-x64/* app/

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          tags: ${{ github.event.inputs.namespace }}/integration-web-editor:latest,${{ github.event.inputs.namespace }}/integration-web-editor:1.0.2
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=${{ runner.temp }}/devant-editor.tar
          push: true
        env:
          NODE_OPTIONS: "--max-old-space-size=32768"

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: ${{ runner.temp }}/devant-editor.tar
