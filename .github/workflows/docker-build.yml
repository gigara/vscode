name: Build and Package

on:
  workflow_dispatch:
    inputs:
      registry:
        description: 'Docker registry to use'
        required: true
        default: digiopsacr.azurecr.io

jobs:
  build:
    runs-on: Runner_integration-web-editor
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: ${{ github.event.inputs.registry }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          tags: ${{ github.event.inputs.registry }}/integration-web-editor:latest,${{ github.event.inputs.registry }}/integration-web-editor:1.0.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=${{ runner.temp }}/devant-editor.tar
          push: true
        env:
          NODE_OPTIONS: "--max-old-space-size=32768"

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: ${{ runner.temp }}/devant-editor.tar
